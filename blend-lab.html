<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blend lab — Peru itinerary</title>
<style>
  :root{ --ink:#F0EAD6; --muted:#D2CAB0; --gold:#C9A24A;
         --ok:#7E9A6C; --bad:#C1583F; --panel:#1B1D18; --panel-2:#25281F; --line:#3B3E31; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--panel);color:var(--ink);
       font-family:'Work Sans',system-ui,-apple-system,sans-serif;}
  .bar{position:sticky;top:0;z-index:10;background:rgba(27,29,24,.97);
       border-bottom:1px solid var(--line);padding:10px 14px;}
  h1{font-size:15px;margin:0 0 2px;font-weight:600;}
  .hint{font-size:11.5px;color:var(--muted);margin:0 0 10px;line-height:1.45;}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;}
  .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
       color:var(--muted);margin-right:4px;min-width:84px;}
  button{font:inherit;font-size:12px;padding:5px 10px;border-radius:999px;
         border:1px solid var(--line);background:var(--panel-2);color:var(--ink);cursor:pointer;}
  button:hover{border-color:var(--gold);}
  button[aria-pressed="true"]{background:var(--gold);color:#1B1D18;
                              border-color:var(--gold);font-weight:600;}
  .why{font-size:11.5px;color:var(--muted);line-height:1.5;max-width:80ch;
       margin:8px 0 0;padding-left:10px;border-left:2px solid var(--line);}
  .why b{color:var(--ink);font-weight:600;}
  .metrics{font-size:11.5px;margin-top:8px;}
  .metrics span{font-variant-numeric:tabular-nums;font-weight:600;}
  .pass{color:var(--ok);} .fail{color:var(--bad);}
  .caveat{font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.45;
          max-width:80ch;font-style:italic;}
  .stage{padding:14px;display:flex;justify-content:center;}
  iframe{border:1px solid var(--line);border-radius:6px;background:#000;
         width:100%;height:76vh;display:block;}
  iframe.phone{width:390px;max-width:100%;}
  canvas{display:none;}
  @media (max-width:640px){ .stage{padding:6px;} iframe{height:72vh;} .lbl{min-width:0;} }
</style>
</head>
<body>

<div class="bar">
  <h1>Blend lab — at-a-glance day sublines</h1>
  <p class="hint">Styling options for the "Lima → Cusco → Sacred Valley → Aguas Calientes" lines.
     Each one restyles the real itinerary live; the published site is untouched.</p>

  <div class="row" id="subs"><span class="lbl">Subline</span></div>
  <div class="row">
    <span class="lbl">Width</span>
    <button data-w="desk">Desktop</button>
    <button data-w="phone">Phone 390px</button>
  </div>

  <p class="why" id="why"></p>
  <div class="metrics" id="metrics"></div>
  <p class="caveat" id="caveat"></p>
</div>

<div class="stage"><iframe id="frame" src="index.html" title="Itinerary preview"></iframe></div>
<canvas id="cv"></canvas>

<script>
/* The live background is settled, so this lab now only varies the day subline.
   `swatch` is the colour the contrast readout should measure; `chip` marks
   options that sit the text on their own tinted background. */
const SUBS = {
  live: {
    name:"Live (as published)",
    why:"What is on the site now: the muted cream at 11.5px, weight 500. Baseline for comparison.",
    swatch:"#E2DAC4", css:""
  },
  gold: {
    name:"Gold",
    why:"The palette's own gold. Warmest and most obviously 'an accent', but it is the darkest colour "
       +"in the palette, so watch the numbers — this is the one most likely to read dim on the bright "
       +"parts of the photo.",
    swatch:"#C9A24A",
    css:`.overview-card .sub{ color:var(--gold)!important; }`
  },
  brightGold: {
    name:"Bright gold",
    why:"The same idea lifted to #E6BE63 and weight 600 — clearly gold, but well clear of the dim end. "
       +"This is the safer of the two gold options.",
    swatch:"#E6BE63",
    css:`.overview-card .sub{ color:#E6BE63!important; font-weight:600!important; }`
  },
  goldArrows: {
    name:"Gold arrows only",
    why:"Cities stay cream and fully legible; only the → separators go gold. The line gains colour and "
       +"rhythm without putting the place names themselves on the weakest colour.",
    swatch:"#E2DAC4",
    css:`.overview-card .sub .arrow{ color:#E6BE63!important; font-weight:700!important; }`,
    js:`document.querySelectorAll('.overview-card .sub').forEach(function(el){
          if(el.dataset.split) return; el.dataset.split='1';
          el.innerHTML = el.innerHTML.replace(/→/g,'<span class="arrow">→</span>');
        });`
  },
  chip: {
    name:"Gold chip",
    why:"Cities in bright gold on a faint gold-tinted band with rounded ends, so the line reads as one "
       +"labelled route rather than loose text. The tint also lifts it off the photo.",
    swatch:"#E8C56B",
    css:`.overview-card .sub{
           color:#E8C56B!important; font-weight:600!important;
           background:rgba(201,162,74,.16)!important;
           border:1px solid rgba(201,162,74,.28)!important;
           border-radius:999px!important;
           padding:3px 9px!important;
           display:inline-block!important;
           margin:0 0 12px!important; }`,
    chip:0.16
  },
  label: {
    name:"Tracked caps",
    why:"Small uppercase with wide letter-spacing in bright gold. Reads as a route label rather than a "
       +"sentence — the most 'designed' option, and the least like body text.",
    swatch:"#E6BE63",
    css:`.overview-card .sub{
           color:#E6BE63!important; font-weight:600!important;
           font-size:10.5px!important;
           text-transform:uppercase!important;
           letter-spacing:.07em!important; }`
  }
};

/* The live stack, for the contrast readout */
const DIM = 0.12, LIFT = 0.065, CARD = 0.20, TARGET = 3.83, PHOTO = "bg-classic.jpg";

const params = new URLSearchParams(location.search);
let current = SUBS[params.get("sub")] ? params.get("sub") : "gold";
let width   = params.get("w") === "phone" ? "phone" : "desk";
const frame = document.getElementById("frame");

const sbox = document.getElementById("subs");
for (const [key, look] of Object.entries(SUBS)){
  const b = document.createElement("button");
  b.textContent = look.name; b.dataset.sub = key;
  b.onclick = () => { current = key; sync(); apply(); };
  sbox.appendChild(b);
}
document.querySelectorAll("[data-w]").forEach(b => b.onclick = () => {
  width = b.dataset.w; sync(); apply();
});

function sync(){
  sbox.querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.sub === current)));
  document.querySelectorAll("[data-w]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.w === width)));
  frame.classList.toggle("phone", width === "phone");
  const q = new URLSearchParams();
  if (current !== "gold") q.set("sub", current);
  if (width === "phone")  q.set("w", "phone");
  history.replaceState(null, "", q.toString() ? "?" + q : location.pathname);
}

function apply(){
  const look = SUBS[current];
  document.getElementById("why").innerHTML = "<b>" + look.name + ".</b> " + look.why;
  try{
    const doc = frame.contentDocument;
    if (doc){
      let tag = doc.getElementById("__lab");
      if (!tag){ tag = doc.createElement("style"); tag.id = "__lab"; doc.head.appendChild(tag); }
      tag.textContent = look.css || "";
      if (look.js) new Function(look.js).call(frame.contentWindow);
    }
  }catch(e){ /* frame not ready; the load handler re-applies */ }
  measure();
}
frame.addEventListener("load", apply);

/* ---- contrast measured off the real photo pixels ---- */
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d", {willReadFrequently:true});
const img = new Image();
img.onload  = () => { img._ready = true; measure(); };
img.onerror = () => { img._failed = true; measure(); };
img.src = PHOTO;

const lum = (r,g,b) => {
  const f = v => { v/=255; return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); };
  return 0.2126*f(r) + 0.7152*f(g) + 0.0722*f(b);
};
const ratio = (a,b) => (Math.max(a,b) + 0.05) / (Math.min(a,b) + 0.05);
const hexLum = hex => { const n = parseInt(hex.slice(1),16);
                        return lum((n>>16)&255, (n>>8)&255, n&255); };

function measure(){
  const look = SUBS[current], out = document.getElementById("metrics");
  if (img._failed){ out.innerHTML = '<span class="fail">Could not load the photo to measure.</span>'; return; }
  if (!img._ready){ out.textContent = "measuring…"; return; }

  const vw = width === "phone" ? 390 : 1440, vh = 900;
  cv.width = vw; cv.height = vh; ctx.clearRect(0,0,vw,vh);
  const sc = Math.max(vw/img.naturalWidth, vh/img.naturalHeight);
  const dw = img.naturalWidth*sc, dh = img.naturalHeight*sc;
  ctx.drawImage(img,(vw-dw)*0.5,(vh-dh)*0.35,dw,dh);
  ctx.fillStyle = `rgba(255,255,255,${LIFT})`; ctx.fillRect(0,0,vw,vh);   // veil
  ctx.fillStyle = `rgba(0,0,0,${DIM})`;        ctx.fillRect(0,0,vw,vh);   // dim
  ctx.fillStyle = `rgba(0,0,0,${CARD})`;       ctx.fillRect(0,0,vw,vh);   // card
  if (look.chip){ ctx.fillStyle = `rgba(201,162,74,${look.chip})`; ctx.fillRect(0,0,vw,vh); }

  const colW = Math.min(860, vw);
  const d = ctx.getImageData(Math.round((vw-colW)/2), 0, colW, vh).data;
  let worst = -1;
  for (let i = 0; i < d.length; i += 4){
    const L = lum(d[i], d[i+1], d[i+2]); if (L > worst) worst = L;
  }
  const r = ratio(hexLum(look.swatch), worst);
  out.innerHTML = `Subline <b>${look.swatch}</b> on the card, worst case: `
    + `<span class="${r>=TARGET?'pass':'fail'}">${r.toFixed(2)}:1</span>`
    + `<span style="color:var(--muted);font-weight:400"> · target ${TARGET}:1</span>`;

  document.getElementById("caveat").textContent =
    "Worst case: the brightest pixel behind the at-a-glance cards, under the live stack "
  + "(veil .065, dim .12, card .20). It reads the background only — the glyph halo genuinely helps "
  + "and cannot appear in this number, so judge with your eyes as well.";
}

sync(); apply();
</script>
</body>
</html>
